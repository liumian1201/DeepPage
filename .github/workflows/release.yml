name: Release on Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.4）'
        required: true
        default: '1.0.4'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: 验证 manifest.json
        run: |
          if [ ! -f src/manifest.json ]; then
            echo "❌ 缺少 src/manifest.json"
            exit 1
          fi
          echo "✅ manifest.json 存在"

      # v1.3.1: 版本一致性校验 —— 防止打错 tag 静默发出错版本包
      - name: 校验版本号一致性
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          MANIFEST_VERSION=$(node -p "require('./src/manifest.json').version")
          MANIFEST_V=$(node -p "require('./src/manifest.json').manifest_version")
          if [ "$MANIFEST_V" != "3" ]; then
            echo "❌ manifest_version 应为 3，实际为 $MANIFEST_V"
            exit 1
          fi
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "❌ 版本不一致：tag/输入 = $VERSION，manifest.json = $MANIFEST_VERSION"
            echo "   请先同步 src/manifest.json 的 version 字段再打 tag"
            exit 1
          fi
          echo "✅ 版本一致: $MANIFEST_VERSION (Manifest V$MANIFEST_V)"

      # v1.3.1: 改动文件语法自检（语法错误不进发布包）
      - name: 语法自检
        run: |
          FAIL=0
          for f in src/js/*.js src/background.js; do
            case "$f" in
              *fflate.min.js) continue ;;
            esac
            if ! node --check "$f"; then
              echo "❌ 语法错误: $f"
              FAIL=1
            fi
          done
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "✅ JS 语法检查通过"

      - name: 检查私钥状态
        id: key_check
        run: |
          if [ -n "${{ secrets.CRX_PRIVATE_KEY }}" ]; then
            echo "CRX_KEY_AVAILABLE=true" >> $GITHUB_ENV
            echo "🔑 检测到私钥，将生成 .crx"
          else
            echo "CRX_KEY_AVAILABLE=false" >> $GITHUB_ENV
            echo "⚠️ 未配置 CRX_PRIVATE_KEY，仅生成 .zip"
          fi

      - name: 打包 .zip
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          ZIP_NAME="DeepPage_v${VERSION}.zip"
          cd src
          zip -r "../${ZIP_NAME}" . -x "DEVELOPMENT.md"
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "✅ .zip 打包完成: ${ZIP_NAME}"

      - name: 打包 .crx
        if: env.CRX_KEY_AVAILABLE == 'true'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          CRX_NAME="DeepPage_v${VERSION}.crx"
          echo "${{ secrets.CRX_PRIVATE_KEY }}" | base64 -d > key.pem
          chromium-browser --no-sandbox --headless=new \
            --pack-extension=./src \
            --pack-extension-key=./key.pem
          mv src.crx "${CRX_NAME}"
          rm -f key.pem
          echo "CRX_NAME=${CRX_NAME}" >> $GITHUB_ENV
          echo "✅ .crx 打包完成: ${CRX_NAME}"

      - name: 提取更新日志
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          CHANGELOG=$(awk -v ver="v${VERSION}" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="DeepPage v${VERSION}"
          fi
          echo "$CHANGELOG" > /tmp/changelog.md
          echo "✅ 已提取 v${VERSION} 更新日志"

      - name: 准备发布文件
        run: |
          FILES="${ZIP_NAME}"
          if [ -n "${CRX_NAME}" ] && [ -f "${CRX_NAME}" ]; then
            FILES="${FILES}
          ${CRX_NAME}"
          fi
          echo "RELEASE_FILES<<EOF" >> $GITHUB_ENV
          echo "$FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "📦 发布文件: $FILES"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "DeepPage v${{ steps.version.outputs.VERSION }}"
          body_path: /tmp/changelog.md
          files: ${{ env.RELEASE_FILES }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 完成
        run: |
          echo "🚀 Release v${{ steps.version.outputs.VERSION }} 已发布!"
          echo "📦 下载: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}"
